# The Payum gateway factory/actions, controllers, and catalog/shipping-method sync are
# wired entirely through config/services.xml — nothing to configure here for the
# payment integration itself.
#
# Topi Elements (https://developer.topi.eu/docs/topi-elements/using-topi-elements) is
# wired below: a global script include + init, plus a rental-price badge on the PDP,
# every product card (listings, homepage, cross-sells, ...), the cart, and every step
# of checkout (sidebar summary on address/select_shipping/select_payment, the
# duration breakdown again on select_payment and complete — the latter has no shared
# sidebar to hook into, see checkout_sidebar_badge.html.twig/rental_overview.html.twig
# for why it needs its own separate hook). Plus a small loading overlay for the
# checkout-complete → Topi-hosted-checkout redirect, see
# checkout_redirect_overlay.html.twig.
#
# The <x-topi-checkout-button> ("Buy now") hooks for the PDP/cart pages are
# deliberately NOT wired here yet: Topi's POST /offers rejects an offer with no
# shipping_address ("missing shipping address for ecom offers") for
# sales_channel=ecommerce, which contradicts the Elements docs' framing of the hosted
# checkout collecting it — needs clarifying with Topi (or a saved-address-only gate
# for logged-in customers) before going live. The controllers/services/templates for
# it (BuyNowOfferService, BuyNowOrderCreator, BuyNowProductOfferController,
# BuyNowCartOfferController, checkout_button_*.html.twig) are already built and
# container-lint-clean, just inert until hooked back in here.
#
# The <x-topi-checkout-button> on the select_payment step (checkout_payment_button.html.twig)
# is a different case and IS wired in below: by that point the order already has a
# real address/shipping method from the normal checkout steps, so CheckoutButtonOfferController
# passes them along via OfferService (not BuyNowOfferService) — Topi's hosted
# checkout has nothing left to collect, so the "missing shipping address" rejection
# above doesn't apply here.
sylius_twig_hooks:
  hooks:
    'sylius_shop.base#javascripts':
      topi_elements_init:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/init.html.twig'
        priority: -100

    'sylius_shop.product.show.content.info.summary':
      topi_rental_badge:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/pdp_badge.html.twig'
        priority: 250

    'sylius_shop.shared.product.card.prices':
      topi_rental_badge:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/listing_badge.html.twig'
        priority: -10

    'sylius_shop.cart.index.content.form.sections.general.summary':
      topi_rental_badge:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/cart_badge.html.twig'
        priority: 150

    'sylius_shop.checkout.common.sidebar.summary':
      topi_rental_badge:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/checkout_sidebar_badge.html.twig'
        priority: -10

    'sylius_shop.checkout.select_payment.content.form':
      topi_rental_overview:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/rental_overview.html.twig'
        priority: 50
      topi_checkout_button:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/checkout_payment_button.html.twig'
        priority: 10

    'sylius_shop.checkout.complete.content.form':
      topi_rental_overview:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/rental_overview.html.twig'
        priority: 150
      topi_redirect_overlay:
        template: '@EilingIoSyliusTopiPlugin/shop/topi_elements/checkout_redirect_overlay.html.twig'
        priority: 60
